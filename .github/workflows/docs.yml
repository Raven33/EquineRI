# Documentation site (docs/DocsProposal.md): builds the site and the coverage
# report. Python only, a few seconds; no C++ compilation (the snippets are
# compiled locally with -DEQUINE_BUILD_DOC_SNIPPETS=ON). Does not deploy.
name: docs

on:
  push:
    paths:
      - "docs/site/**"
      - "src/RI/**"
      - "backends/*/RI/**"
      - "CONTEXT.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - "src/RI/**"
      - "backends/*/RI/**"
      - "CONTEXT.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the coverage report compares translation dates.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - name: Install the site toolchain
        run: pip install -r docs/site/requirements.txt

      - name: Generate signatures, decision log, coverage report
        run: python docs/site/scripts/generate.py

      - name: Build the site
        run: mkdocs build --strict -f docs/site/mkdocs.yml

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/site/site
          retention-days: 7
